# fly.toml app configuration file generated for mandate-keeper on 2026-10-30T20:46:11+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mandate-keeper'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile.keeper'

[env]
  AUTO_RELAY = 'false'
  PORT = '8787'

[[mounts]]
  source = 'keeper_data'
  destination = '/app/data'

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = 'off'
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '10s'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
