[profile.default]
src = "contracts"
test = "test"
out = "out"
libs = ["lib", "../node_modules"]
remappings = [
  "@openzeppelin/=../node_modules/@openzeppelin/",
  "forge-std/=lib/forge-std/src/"
]
optimizer = true
optimizer_runs = 200
evm_version = "shanghai"
gas_reports = ["MandateArena", "BreakCertificate"]

[fuzz]
runs = 256
