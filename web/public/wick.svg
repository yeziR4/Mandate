<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Wick, a firefly">
  <!-- Flat silhouette in the same visual language as the Otari mark: one solid colour,
       chunky geometry, no gradients. A firefly, because the product is an always-on light. -->

  <!-- wings -->
  <path d="M62 46c-10-14-24-20-32-16-8 4-6 20 4 30 8 8 20 10 28 6z" fill="#0F9FB5" opacity="0.55"/>
  <path d="M66 46c10-14 24-20 32-16 8 4 6 20-4 30-8 8-20 10-28 6z" fill="#0F9FB5" opacity="0.55"/>

  <!-- antennae -->
  <path d="M58 40c-2-8-6-12-12-14" fill="none" stroke="#0F9FB5" stroke-width="5" stroke-linecap="round"/>
  <path d="M70 40c2-8 6-12 12-14" fill="none" stroke="#0F9FB5" stroke-width="5" stroke-linecap="round"/>

  <!-- body -->
  <path d="M64 36c14 0 24 12 24 28 0 18-10 32-24 32S40 82 40 64c0-16 10-28 24-28z" fill="#0F9FB5"/>

  <!-- head / face patch -->
  <path d="M64 36c10 0 18 7 21 17-6 5-13 7-21 7s-15-2-21-7c3-10 11-17 21-17z" fill="#0B2B33"/>

  <!-- eyes -->
  <circle cx="56" cy="52" r="4.6" fill="#EEE5E4"/>
  <circle cx="72" cy="52" r="4.6" fill="#EEE5E4"/>

  <!-- glowing tail -->
  <ellipse cx="64" cy="92" rx="13" ry="9" fill="#FFB43A"/>
  <ellipse cx="64" cy="92" rx="7" ry="5" fill="#FFE6B0"/>

  <!-- body segments -->
  <path d="M44 74h40" stroke="#0B2B33" stroke-width="3" stroke-linecap="round" opacity="0.45"/>
  <path d="M47 84h34" stroke="#0B2B33" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
</svg>
