<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Pup, a seal pup balancing a ball">
  <!-- Flat and chunky, in the same visual language as the Otari mark: solid colour, no gradients.
       A seal pup, because Otari is a sea lion. -->
  <rect width="96" height="96" rx="24" fill="#0098A4"/>
  <g fill="#FFFFFF">
    <ellipse cx="17" cy="84" rx="11" ry="5.5" transform="rotate(-24 17 84)"/>
    <ellipse cx="79" cy="84" rx="11" ry="5.5" transform="rotate(24 79 84)"/>
    <ellipse cx="48" cy="84" rx="31" ry="17"/>
    <ellipse cx="48" cy="52" rx="29" ry="26"/>
  </g>
  <circle cx="40.5" cy="63" r="8.5" fill="#DBF1F2"/>
  <circle cx="55.5" cy="63" r="8.5" fill="#DBF1F2"/>
  <ellipse cx="48" cy="57.5" rx="5" ry="3.6" fill="#005B63"/>
  <circle cx="35" cy="48" r="4.6" fill="#005B63"/>
  <circle cx="61" cy="48" r="4.6" fill="#005B63"/>
  <circle cx="36.5" cy="46.5" r="1.5" fill="#FFFFFF"/>
  <circle cx="62.5" cy="46.5" r="1.5" fill="#FFFFFF"/>
  <circle cx="48" cy="16" r="10" fill="#FFC629"/>
</svg>
